<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Structured Literacy Wordle - Silent Letters & Trigraphs</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Clear Sans', 'Helvetica Neue', Arial, sans-serif; display: flex; flex-direction: column; align-items: center; background: #121213; color: white; margin: 0; padding: 15px; min-height: 100vh; justify-content: space-between; }
    h1 { margin: 0 0 5px 0; font-size: 2rem; letter-spacing: 0.1rem; border-bottom: 1px solid #3a3a3c; width: 100%; text-align: center; padding-bottom: 5px; }
    #game-container { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%; max-width: 900px; }
    
    .btn-group { display: flex; gap: 10px; margin-top: 10px; }
    button { background: #538d4e; color: white; border: none; padding: 12px 24px; font-weight: bold; cursor: pointer; border-radius: 5px; font-size: 0.95rem; text-transform: uppercase; }
    button:hover { background: #6aaa64; }
    button.secondary { background: #b59f3b; }
    button.secondary:hover { background: #c9b046; }
    
    /* Clue Box Styling */
    #clue-box { background-color: #1e293b; border: 1px solid #38bdf8; color: #e2e8f0; padding: 10px 15px; border-radius: 6px; font-size: 0.95rem; text-align: center; max-width: 600px; width: 100%; min-height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
    #clue-box span { color: #38bdf8; font-weight: bold; margin-right: 6px; }
    #definition-hint { color: #f39c12; font-style: italic; font-size: 0.88rem; }

    /* Centered Dynamic Grid Styling */
    .grid { display: flex; flex-direction: column; gap: 5px; margin-bottom: 5px; width: 100%; align-items: center; }
    .row { display: flex; gap: 5px; justify-content: center; }
    .tile { width: 44px; height: 44px; border: 2px solid #3a3a3c; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; font-weight: bold; text-transform: uppercase; user-select: none; cursor: pointer; transition: transform 0.15s ease-in-out, background-color 0.2s, border-color 0.2s; }
    
    /* Active word length vs Dark gray extra boxes */
    .tile.active-box { background-color: #1e293b; border: 2px solid #38bdf8; }
    .tile.disabled-box { background-color: #121213; border: 1px solid #222224; opacity: 0.2; cursor: default; }

    /* Selected box marker */
    .tile.selected { border-color: #f39c12 !important; background-color: #2c3e50 !important; }
    .tile[data-state="active"] { animation: pop 0.1s ease-in-out; }
    
    /* Colors & Animations */
    .correct { background: #538d4e !important; border-color: #538d4e !important; color: white; opacity: 1 !important; }
    .present { background: #b59f3b !important; border-color: #b59f3b !important; color: white; opacity: 1 !important; }
    .absent { background: #3a3a3c !important; border-color: #3a3a3c !important; color: white; opacity: 1 !important; }
    .flip { animation: flip 0.5s ease forwards; }
    .shake { animation: shake 0.5s; }
    
    @keyframes pop { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
    @keyframes shake { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-5px); } 40%, 80% { transform: translateX(5px); } }
    @keyframes flip { 0% { transform: rotateX(0); } 50% { transform: rotateX(90deg); } 100% { transform: rotateX(0); } }

    /* On-Screen Keyboard */
    #keyboard { display: flex; flex-direction: column; gap: 6px; width: 100%; max-width: 500px; margin-top: auto; }
    .keyboard-row { display: flex; justify-content: center; gap: 4px; touch-action: manipulation; }
    .key { background: #818384; color: white; border: 0; border-radius: 4px; height: 50px; flex: 1; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 0.9rem; cursor: pointer; user-select: none; }
    .key.wide { flex: 1.5; font-size: 0.75rem; }
    
    #message { font-size: 1.1rem; height: 25px; font-weight: bold; color: #f39c12; text-align: center; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <h1>WORDLE</h1>

  <div id="game-container">
    <div id="clue-box">
      <div id="pattern-hint"><span>Hint:</span> Loading hint...</div>
      <div id="definition-hint" class="hidden"></div>
    </div>
    <div id="message"></div>

    <div id="grid" class="grid"></div>

    <div id="keyboard">
      <div class="keyboard-row">
        <button class="key" onclick="handleKey('Q')">Q</button>
        <button class="key" onclick="handleKey('W')">W</button>
        <button class="key" onclick="handleKey('E')">E</button>
        <button class="key" onclick="handleKey('R')">R</button>
        <button class="key" onclick="handleKey('T')">T</button>
        <button class="key" onclick="handleKey('Y')">Y</button>
        <button class="key" onclick="handleKey('U')">U</button>
        <button class="key" onclick="handleKey('I')">I</button>
        <button class="key" onclick="handleKey('O')">O</button>
        <button class="key" onclick="handleKey('P')">P</button>
      </div>
      <div class="keyboard-row">
        <button class="key" onclick="handleKey('A')">A</button>
        <button class="key" onclick="handleKey('S')">S</button>
        <button class="key" onclick="handleKey('D')">D</button>
        <button class="key" onclick="handleKey('F')">F</button>
        <button class="key" onclick="handleKey('G')">G</button>
        <button class="key" onclick="handleKey('H')">H</button>
        <button class="key" onclick="handleKey('J')">J</button>
        <button class="key" onclick="handleKey('K')">K</button>
        <button class="key" onclick="handleKey('L')">L</button>
      </div>
      <div class="keyboard-row">
        <button class="key wide" onclick="handleKey('ENTER')">ENTER</button>
        <button class="key" onclick="handleKey('Z')">Z</button>
        <button class="key" onclick="handleKey('X')">X</button>
        <button class="key" onclick="handleKey('C')">C</button>
        <button class="key" onclick="handleKey('V')">V</button>
        <button class="key" onclick="handleKey('B')">B</button>
        <button class="key" onclick="handleKey('N')">N</button>
        <button class="key" onclick="handleKey('M')">M</button>
        <button class="key wide" onclick="handleKey('BACKSPACE')">DELETE</button>
      </div>
    </div>
    
    <div class="btn-group">
      <button id="hint-btn" class="secondary hidden" onclick="showExtraHint()">Need Extra Hint?</button>
      <button id="next-btn" class="hidden" onclick="nextWord()">Play Next Word</button>
    </div>
  </div>

  <script>
    /* ------------------------------------------------------------------
       TEACHER SETUP: Master Word List & Expanded Offline Dictionary
    ------------------------------------------------------------------ */
    const TARGET_WORDS = [
      // Trigraph: -tch
      { word: "CATCH", pattern: "tch", clue: "To grab and hold something moving through the air." },
      { word: "MATCH", pattern: "tch", clue: "A small wooden stick used to make a flame." },
      { word: "PATCH", pattern: "tch", clue: "A small piece of material used to mend a hole." },
      { word: "PITCH", pattern: "tch", clue: "To throw a ball, or the highness of a sound." },
      { word: "WITCH", pattern: "tch", clue: "A character in stories who uses magic spells." },
      { word: "SWITCH", pattern: "tch", clue: "A device used to turn an electric light on or off." },
      { word: "SKETCH", pattern: "tch", clue: "A quick, simple drawing made without many details." },
      { word: "STITCH", pattern: "tch", clue: "A single loop of thread created with a sewing needle." },
      { word: "FETCH", pattern: "tch", clue: "To go after something and bring it back." },
      { word: "KITCHEN", pattern: "tch", clue: "A room in the house where food is cooked." },
      { word: "GLITCH", pattern: "tch", clue: "A sudden, brief malfunction or fault in equipment." },
      { word: "HATCH", pattern: "tch", clue: "To emerge from an egg." },
      { word: "LATCH", pattern: "tch", clue: "A metal bar used to fasten a door or gate." },
      { word: "SNATCH", pattern: "tch", clue: "To quickly seize something in a rude or eager way." },

      // Trigraph: -dge
      { word: "BADGE", pattern: "dge", clue: "A small emblem worn to show rank or membership." },
      { word: "EDGE", pattern: "dge", clue: "The outside limit or border of an object or area." },
      { word: "LEDGE", pattern: "dge", clue: "A narrow horizontal surface projecting from a wall." },
      { word: "HEDGE", pattern: "dge", clue: "A fence formed by closely growing bushes or shrubs." },
      { word: "BRIDGE", pattern: "dge", clue: "A structure built over water, road, or railway." },
      { word: "RIDGE", pattern: "dge", clue: "A long narrow hilltop, mountain range, or crest." },
      { word: "FRIDGE", pattern: "dge", clue: "An appliance used to keep food and drinks cold." },
      { word: "LODGE", pattern: "dge", clue: "A small house in the country used for holidays." },
      { word: "JUDGE", pattern: "dge", clue: "A public officer appointed to decide cases in a court." },
      { word: "FUDGE", pattern: "dge", clue: "A soft, rich sweet made from sugar, butter, and milk." },
      { word: "PLEDGE", pattern: "dge", clue: "A solemn promise or agreement to do something." },
      { word: "SLUDGE", pattern: "dge", clue: "Thick, soft, wet mud or a viscous mixture." },
      { word: "TRUDGE", pattern: "dge", clue: "Walk slowly and with heavy steps from exhaustion." },
      { word: "GRUDGE", pattern: "dge", clue: "A persistent feeling of ill will or resentment." },
      { word: "SMUDGE", pattern: "dge", clue: "A cause to become smeared or blurred." },
      { word: "BADGER", pattern: "dge", clue: "A heavily built nocturnal mammal with a striped head." },
      { word: "FIDGET", pattern: "dge", clue: "Make small movements through nervousness or impatience." },
      { word: "BUDGET", pattern: "dge", clue: "An estimate of income and expenditure for a set time." },
      { word: "GADGET", pattern: "dge", clue: "A small mechanical or electronic device or tool." },
      { word: "SLEDGE", pattern: "dge", clue: "A vehicle pulled over snow, or a heavy hammer." },
      { word: "DODGE", pattern: "dge", clue: "Avoid someone or something by a quick movement." },
      { word: "NUDGE", pattern: "dge", clue: "Prod someone gently, typically with an elbow." },

      // Trigraph: -igh
      { word: "LIGHT", pattern: "igh", clue: "The natural agent that stimulates sight and makes things visible." },
      { word: "NIGHT", pattern: "igh", clue: "The period of darkness in each twenty-four hours." },
      { word: "BRIGHT", pattern: "igh", clue: "Giving out or reflecting much light; shining." },
      { word: "FLIGHT", pattern: "igh", clue: "An action or process of flying through the air." },
      { word: "FRIGHT", pattern: "igh", clue: "A sudden intense feeling of fear." },
      { word: "SLIGHT", pattern: "igh", clue: "Small in degree, size, or importance." },
      { word: "HIGH", pattern: "igh", clue: "Great, or greater than normal, in quantity, size, or intensity." },
      { word: "SIGH", pattern: "igh", clue: "Emit a long, deep, audible breath expressing sadness or relief." },
      { word: "MIGHT", pattern: "igh", clue: "Great and impressive power or strength." },
      { word: "TIGHT", pattern: "igh", clue: "Fixed, fastened, or held firmly in position." },

      // Silent Letters & Consonant Patterns
      { word: "WRECK", pattern: "wr", clue: "To destroy or ruin something completely." },
      { word: "WRAP", pattern: "wr", clue: "To cover something in paper or cloth as a gift." },
      { word: "WRITE", pattern: "wr", clue: "To mark letters or words on paper using a pen or pencil." },
      { word: "WRESTLE", pattern: "wr", clue: "To fight or grapple with someone as a sport." },
      { word: "WRIST", pattern: "wr", clue: "The joint connecting your hand to your arm." },
      { word: "KNOW", pattern: "kn", clue: "To understand or have information about something." },
      { word: "KNOCK", pattern: "kn", clue: "To strike a door sharply with your knuckles." },
      { word: "KNOT", pattern: "kn", clue: "A fastening made by tying a piece of string or rope." },
      { word: "KNIGHT", pattern: "kn", clue: "A warrior in armor who served a king in medieval times." },
      { word: "THROUGH", pattern: "ough", clue: "Moving in one side and out the other side." },
      { word: "ENOUGH", pattern: "ough", clue: "As much or as many as required or needed." },
      { word: "DOUGH", pattern: "ough", clue: "A thick mixture of flour and water ready to be baked." },
      { word: "CANDLE", pattern: "-le", clue: "A stick of wax with a wick that burns to give light." },
      { word: "PUZZLE", pattern: "-le", clue: "A game or problem designed to test ingenuity." }
    ];

    const EXTRA_OFFLINE_DICTIONARY = [
      "CRANE", "STARE", "PLANT", "TRAIN", "HOUSE", "MOUSE", "CLOCK", "STONE",
      "SNAKE", "GRASS", "WATER", "BREAD", "CHAIR", "TABLE", "PAPER", "SMART",
      "SHARK", "SHEEP", "SHIRT", "SHOES", "DRIVE", "DREAM", "FLOWER", "GARDEN"
    ];

    const MAX_GRID_SIZE = 13;

    let wordList = [];
    let currentWordObj = null;
    let targetWord = "";
    let wordLength = 6;
    let startIndex = 0;
    let currentRow = 0;
    let currentTile = 0;
    let guesses = [];
    let gameOver = false;
    let validWordsSet = new Set();
    const keyStateMap = {};

    function startGame() {
      const allWords = [
        ...TARGET_WORDS.map(item => item.word),
        ...EXTRA_OFFLINE_DICTIONARY
      ];
      validWordsSet = new Set(allWords.map(w => w.trim().toUpperCase()));

      wordList = TARGET_WORDS.map(item => ({
        word: item.word.trim().toUpperCase(),
        pattern: item.pattern,
        clue: item.clue
      })).sort(() => Math.random() - 0.5);

      nextWord();
    }

    function generatePatternHint(wordObj) {
      return `Target Pattern: -${wordObj.pattern.toLowerCase()}- (${wordObj.word.length} letters)`;
    }

    function nextWord() {
      if (wordList.length === 0) {
        showMessage("Game Over! All words solved.", 0);
        document.getElementById('pattern-hint').innerHTML = "<span>Hint:</span> All puzzles complete!";
        document.getElementById('definition-hint').classList.add('hidden');
        document.getElementById('hint-btn').classList.add('hidden');
        document.getElementById('next-btn').classList.add('hidden');
        return;
      }

      currentWordObj = wordList.pop();
      targetWord = currentWordObj.word;
      wordLength = targetWord.length;
      
      // Reset Hints
      document.getElementById('pattern-hint').innerHTML = `<span>Hint:</span> ${generatePatternHint(currentWordObj)}`;
      const defDiv = document.getElementById('definition-hint');
      defDiv.innerText = "";
      defDiv.classList.add('hidden');

      startIndex = Math.floor((MAX_GRID_SIZE - wordLength) / 2);
      
      currentRow = 0;
      currentTile = 0;
      guesses = Array(6).fill("").map(() => Array(wordLength).fill(""));
      gameOver = false;

      document.getElementById('message').innerText = "";
      document.getElementById('next-btn').classList.add('hidden');
      document.getElementById('hint-btn').classList.add('hidden');

      resetKeyboard();
      buildGrid();
    }

    function showExtraHint() {
      if (currentWordObj && currentWordObj.clue) {
        const defDiv = document.getElementById('definition-hint');
        defDiv.innerText = `Meaning: ${currentWordObj.clue}`;
        defDiv.classList.remove('hidden');
        document.getElementById('hint-btn').classList.add('hidden');
      }
    }

    function resetKeyboard() {
      document.querySelectorAll('.key').forEach(k => {
        k.className = k.classList.contains('wide') ? 'key wide' : 'key';
      });
      for (let key in keyStateMap) delete keyStateMap[key];
    }

    function buildGrid() {
      const grid = document.getElementById('grid');
      grid.innerHTML = "";
      for (let i = 0; i < 6; i++) {
        const row = document.createElement('div');
        row.className = 'row';
        row.id = `row-${i}`;
        
        for (let j = 0; j < MAX_GRID_SIZE; j++) {
          const tile = document.createElement('div');
          tile.className = 'tile';
          tile.id = `tile-${i}-${j}`;
          
          if (j >= startIndex && j < startIndex + wordLength) {
            tile.classList.add('active-box');
            tile.onclick = () => {
              if (i === currentRow && !gameOver) {
                selectTile(j - startIndex);
              }
            };
          } else {
            tile.classList.add('disabled-box');
          }
          
          row.appendChild(tile);
        }
        grid.appendChild(row);
      }
      highlightSelectedTile();
    }

    function selectTile(relativeIndex) {
      currentTile = relativeIndex;
      highlightSelectedTile();
    }

    function highlightSelectedTile() {
      for (let j = 0; j < wordLength; j++) {
        const tile = document.getElementById(`tile-${currentRow}-${startIndex + j}`);
        if (tile) tile.classList.remove('selected');
      }
      if (currentTile >= 0 && currentTile < wordLength) {
        const activeTile = document.getElementById(`tile-${currentRow}-${startIndex + currentTile}`);
        if (activeTile) activeTile.classList.add('selected');
      }
    }

    document.addEventListener('keydown', (e) => {
      if (gameOver) return;
      if (e.key === 'Enter') handleKey('ENTER');
      else if (e.key === 'Backspace') handleKey('BACKSPACE');
      else if (e.key === 'ArrowLeft') moveSelection(-1);
      else if (e.key === 'ArrowRight') moveSelection(1);
      else if (/^[a-zA-Z]$/.test(e.key)) handleKey(e.key.toUpperCase());
    });

    function moveSelection(direction) {
      const newPos = currentTile + direction;
      if (newPos >= 0 && newPos < wordLength) {
        selectTile(newPos);
      }
    }

    function handleKey(key) {
      if (gameOver) return;
      if (key === 'ENTER') submitGuess();
      else if (key === 'BACKSPACE') removeLetter();
      else addLetter(key);
    }

    function addLetter(letter) {
      if (currentTile < wordLength && currentRow < 6) {
        guesses[currentRow][currentTile] = letter;
        const tile = document.getElementById(`tile-${currentRow}-${startIndex + currentTile}`);
        tile.innerText = letter;
        tile.setAttribute('data-state', 'active');
        
        if (currentTile < wordLength - 1) {
          currentTile++;
        }
        highlightSelectedTile();
      }
    }

    function removeLetter() {
      if (currentRow < 6) {
        const currentBoxVal = guesses[currentRow][currentTile];
        
        if (currentBoxVal !== "") {
          guesses[currentRow][currentTile] = "";
          const tile = document.getElementById(`tile-${currentRow}-${startIndex + currentTile}`);
          tile.innerText = "";
          tile.removeAttribute('data-state');
        } else if (currentTile > 0) {
          currentTile--;
          guesses[currentRow][currentTile] = "";
          const tile = document.getElementById(`tile-${currentRow}-${startIndex + currentTile}`);
          tile.innerText = "";
          tile.removeAttribute('data-state');
        }
        highlightSelectedTile();
      }
    }

    function showMessage(msg, duration = 2000) {
      const msgDiv = document.getElementById('message');
      msgDiv.innerText = msg;
      if (duration) setTimeout(() => { if (msgDiv.innerText === msg) msgDiv.innerText = ""; }, duration);
    }

    function submitGuess() {
      for (let i = 0; i < wordLength; i++) {
        if (!guesses[currentRow][i] || guesses[currentRow][i].trim() === "") {
          showMessage("Fill all letters");
          shakeRow(currentRow);
          return;
        }
      }

      const guess = guesses[currentRow].join("").toUpperCase();

      if (!validWordsSet.has(guess)) {
        showMessage("Not a valid word!");
        shakeRow(currentRow);
        return;
      }

      highlightSelectedTile();
      const currentSelectedTile = document.getElementById(`tile-${currentRow}-${startIndex + currentTile}`);
      if (currentSelectedTile) currentSelectedTile.classList.remove('selected');

      const targetArr = targetWord.split("");
      const resultColors = Array(wordLength).fill('absent');

      // Pass 1: Green matches
      for (let i = 0; i < wordLength; i++) {
        if (guess[i] === targetWord[i]) {
          resultColors[i] = 'correct';
          targetArr[i] = null;
        }
      }

      // Pass 2: Yellow matches
      for (let i = 0; i < wordLength; i++) {
        if (resultColors[i] === 'absent') {
          const indexInTarget = targetArr.indexOf(guess[i]);
          if (indexInTarget !== -1) {
            resultColors[i] = 'present';
            targetArr[indexInTarget] = null;
          }
        }
      }

      // Animate flip & reveal
      for (let i = 0; i < wordLength; i++) {
        const tile = document.getElementById(`tile-${currentRow}-${startIndex + i}`);
        const letter = guess[i];
        
        setTimeout(() => {
          tile.classList.add('flip');
          tile.classList.add(resultColors[i]);
          updateKeyboard(letter, resultColors[i]);
        }, i * 200);
      }

      // Handle Game Outcomes
      setTimeout(() => {
        if (guess === targetWord) {
          showMessage("Splendid!", 0);
          gameOver = true;
          document.getElementById('next-btn').classList.remove('hidden');
          document.getElementById('hint-btn').classList.add('hidden');
        } else if (currentRow === 5) {
          showMessage(`Word was: ${targetWord}`, 0);
          gameOver = true;
          document.getElementById('next-btn').classList.remove('hidden');
          document.getElementById('hint-btn').classList.add('hidden');
        } else {
          currentRow++;
          currentTile = 0;
          highlightSelectedTile();

          // Reveal "Need Extra Hint?" button starting from row index 2 (3rd attempt)
          if (currentRow >= 2 && document.getElementById('definition-hint').classList.contains('hidden')) {
            document.getElementById('hint-btn').classList.remove('hidden');
          }
        }
      }, wordLength * 200);
    }

    function shakeRow(rowIdx) {
      const row = document.getElementById(`row-${rowIdx}`);
      row.classList.add('shake');
      setTimeout(() => row.classList.remove('shake'), 500);
    }

    function updateKeyboard(letter, state) {
      const priority = { 'correct': 3, 'present': 2, 'absent': 1 };
      const currentState = keyStateMap[letter];

      if (!currentState || priority[state] > priority[currentState]) {
        keyStateMap[letter] = state;
        document.querySelectorAll('.key').forEach(k => {
          if (k.innerText === letter) {
            k.className = `key ${state}`;
          }
        });
      }
    }

    window.onload = startGame;
  </script>
</body>
</html>
